<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Screen enclosure panel identification guide</title>
  <desc id="desc">A labeled pool enclosure diagram identifying roof panels, upper wall panels, lower wall panels, screen door and Florida Glass panels.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf3ef"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0H9M0 0V9" fill="none" stroke="#23463c" stroke-opacity=".12" stroke-width=".8"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#a98545"/>
    </marker>
    <style>
      .frame{fill:none;stroke:#18342d;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
      .bar{fill:none;stroke:#35564d;stroke-width:5;stroke-linecap:round}
      .screen{fill:url(#mesh);stroke:#35564d;stroke-width:2}
      .glass{fill:#d9c99e;fill-opacity:.55;stroke:#35564d;stroke-width:2}
      .call{fill:none;stroke:#a98545;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#132823}
      .sub{font-family:Arial,sans-serif;font-size:15px;fill:#64716d}
      .tag{fill:#132823}
      .tagtext{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#fff;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1000" height="610" rx="10" fill="url(#sky)"/>
  <path d="M80 520H920" stroke="#d8ddd8" stroke-width="3"/>

  <!-- enclosure -->
  <path class="screen" d="M255 210L450 86 802 150 700 252Z"/>
  <path class="screen" d="M255 210L700 252V520H255Z"/>
  <path class="screen" d="M700 252L802 150V520H700Z"/>
  <path class="frame" d="M255 520V210L450 86 802 150V520M255 210L700 252 802 150M700 252V520M255 520H802"/>
  <path class="bar" d="M255 365L700 385 802 350M365 196V520M485 220V520M610 232V520M755 198V520M450 86L485 220M570 108L610 232M690 130L700 252"/>

  <!-- door -->
  <path fill="#fbfaf7" fill-opacity=".72" stroke="#18342d" stroke-width="6" d="M365 365H485V520H365Z"/>
  <circle cx="466" cy="444" r="5" fill="#a98545"/>

  <!-- Florida Glass example -->
  <path class="glass" d="M610 381L700 385V520H610Z"/>

  <!-- labels -->
  <rect class="tag" x="54" y="44" width="138" height="31" rx="15"/>
  <text class="tagtext" x="123" y="65" text-anchor="middle">PANEL GUIDE</text>

  <text class="label" x="65" y="132">Roof / top panel</text>
  <text class="sub" x="65" y="157">Overhead screen section</text>
  <path class="call" d="M228 144C295 142 352 137 430 127"/>

  <text class="label" x="65" y="282">Large / upper panel</text>
  <text class="sub" x="65" y="307">Taller wall opening</text>
  <path class="call" d="M239 294C315 292 493 296 547 300"/>

  <text class="label" x="65" y="447">Standard / lower panel</text>
  <text class="sub" x="65" y="472">Typical wall opening</text>
  <path class="call" d="M251 458C286 458 307 451 332 438"/>

  <text class="label" x="744" y="294">Screen door</text>
  <text class="sub" x="744" y="319">Door re-screening</text>
  <path class="call" d="M741 326C655 360 572 409 475 431"/>

  <text class="label" x="718" y="449">Florida Glass</text>
  <text class="sub" x="718" y="474">Privacy / splash barrier</text>
  <path class="call" d="M716 464C690 467 675 466 653 456"/>
</svg>
